[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-verifier"
version = "1.2.0"
description = "AI Evals for PMs: outcome, trajectory, system, and memory evaluation with evidence-backed release gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhillash Jadhav" }]
keywords = ["ai", "evals", "product-management", "release-gates"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
pm-verifier = "pm_verifier.cli:main"

[project.urls]
Repository = "https://github.com/Abhillashjadhav/AI-PM-essential-skills"
Documentation = "https://github.com/Abhillashjadhav/AI-PM-essential-skills/tree/main/pm-verifier"

[tool.setuptools]
package-dir = { "" = "skills/eval-engine/harness" }

[tool.setuptools.packages.find]
where = ["skills/eval-engine/harness"]
include = ["pm_verifier*"]

[tool.setuptools.package-data]
pm_verifier = ["schemas/*.json"]
